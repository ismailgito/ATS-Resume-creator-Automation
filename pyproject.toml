[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-resume-automation"
version = "0.1.0"
description = "ATS-compliant resume discovery, scoring, tailoring and review automation for Performance & Digital Marketing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.2",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "supabase>=2.3.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
ats-resume = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
