name: CI Test Suite and ATS Quality Gate

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Environment Check
        run: |
          python -m src.cli check-env

      - name: Run Test Suite
        run: |
          python -m pytest -v --tb=short

      - name: Run Sample Job Execution (Deterministic Verification)
        run: |
          python -m src.cli run-sample 01-perf-mktg-manager

      - name: Upload Generated Resume Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-review-package
          path: outputs/
          if-no-files-found: ignore
