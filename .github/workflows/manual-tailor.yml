name: Manual Job Resume Tailoring

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: "Job Listing URL (Naukri or Public Posting)"
        required: false
        default: ""
      job_title:
        description: "Job Title (optional if URL provided)"
        required: false
        default: "Target Marketing Role"
      company_name:
        description: "Company Name (optional if URL provided)"
        required: false
        default: "Target Employer"
      job_text:
        description: "Or Paste Job Description Text directly"
        required: false
        default: ""
      force_generate:
        description: "Force generate resume regardless of score? (true/false)"
        required: false
        default: "false"

jobs:
  tailor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Tailor Resume Package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Enables Telegram alerts for daily-limit / mid-run errors
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.job_url }}" ]; then
            python -m src.cli ingest --url "${{ github.event.inputs.job_url }}" ${{ github.event.inputs.force_generate == 'true' && '--force' || '' }}
          elif [ -n "${{ github.event.inputs.job_text }}" ]; then
            python -m src.cli ingest --text "${{ github.event.inputs.job_text }}" --title "${{ github.event.inputs.job_title }}" --company "${{ github.event.inputs.company_name }}" ${{ github.event.inputs.force_generate == 'true' && '--force' || '' }}
          else
            echo "Running default sample job..."
            python -m src.cli run-sample 01-perf-mktg-manager
          fi

      - name: Upload Generated Package
        uses: actions/upload-artifact@v4
        with:
          name: tailored-resume-package
          path: outputs/
          retention-days: 30

      - name: Telegram Run Summary
        # Always fires – success or failure – but skips gracefully when the
        # Telegram secrets are not configured on the repository.
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured - skipping summary."
            exit 0
          fi
          if [ "$RUN_STATUS" = "success" ]; then
            TEXT="✅ ATS manual tailoring run completed successfully — ${RUN_URL}"
          else
            TEXT="❌ ATS manual tailoring run ${RUN_STATUS} — ${RUN_URL}"
          fi
          python -c 'import json, os; print(json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": os.environ["TEXT"]}))' > "$RUNNER_TEMP/tg_payload.json"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d @"$RUNNER_TEMP/tg_payload.json" \
            || echo "::warning::Telegram summary message failed to send"
