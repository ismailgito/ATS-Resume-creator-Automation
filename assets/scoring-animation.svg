<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="indigoBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="roseBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="amberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="barGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bar-fill {
      animation: fillProgress 4s ease-out infinite alternate;
    }

    .pulse-text {
      animation: pulseOpacity 2s ease-in-out infinite alternate;
    }

    @keyframes fillProgress {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulseOpacity {
      0% { opacity: 0.7; }
      100% { opacity: 1; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.8)); }
    }
  </style>

  <!-- Container -->
  <rect x="5" y="5" width="940" height="310" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">📊 DETERMINISTIC 7-FACTOR MATCH SCORING WEIGHTS</text>
  <text x="730" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TRANSPARENT FIT MATRIX</text>
  <line x1="35" y1="48" x2="915" y2="48" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Factor 1: Skills Match (25%) -->
  <g transform="translate(35, 65)">
    <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Required Skills Match</text>
    <text x="210" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">25%</text>
    <rect x="260" y="4" width="450" height="14" rx="7" fill="#1e293b" />
    <line x1="260" y1="11" x2="372.5" y2="11" stroke="url(#blueBar)" stroke-width="14" stroke-dasharray="400" class="bar-fill" stroke-linecap="round"/>
    <text x="725" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">SEM, PPC, GA4, Meta Ads, GTM</text>
  </g>

  <!-- Factor 2: Target Title & Family (20%) -->
  <g transform="translate(35, 98)">
    <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Target Title &amp; Family</text>
    <text x="210" y="16" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">20%</text>
    <rect x="260" y="4" width="450" height="14" rx="7" fill="#1e293b" />
    <line x1="260" y1="11" x2="350" y2="11" stroke="url(#indigoBar)" stroke-width="14" stroke-dasharray="400" class="bar-fill" stroke-linecap="round"/>
    <text x="725" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Performance, Digital, Growth Lead</text>
  </g>

  <!-- Factor 3: Platforms & Tools (15%) -->
  <g transform="translate(35, 131)">
    <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Platforms &amp; Tools</text>
    <text x="210" y="16" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">15%</text>
    <rect x="260" y="4" width="450" height="14" rx="7" fill="#1e293b" />
    <line x1="260" y1="11" x2="327.5" y2="11" stroke="url(#purpleBar)" stroke-width="14" stroke-dasharray="400" class="bar-fill" stroke-linecap="round"/>
    <text x="725" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Google Ads, Looker Studio, Adjust</text>
  </g>

  <!-- Factor 4: Experience Bounds (15%) -->
  <g transform="translate(35, 164)">
    <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Experience Bounds</text>
    <text x="210" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">15%</text>
    <rect x="260" y="4" width="450" height="14" rx="7" fill="#1e293b" />
    <line x1="260" y1="11" x2="327.5" y2="11" stroke="url(#emeraldBar)" stroke-width="14" stroke-dasharray="400" class="bar-fill" stroke-linecap="round"/>
    <text x="725" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">1-4 Yrs Factual Tenure Verification</text>
  </g>

  <!-- Factor 5: Industry Relevance (10%) -->
  <g transform="translate(35, 197)">
    <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Industry Relevance</text>
    <text x="210" y="16" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">10%</text>
    <rect x="260" y="4" width="450" height="14" rx="7" fill="#1e293b" />
    <line x1="260" y1="11" x2="305" y2="11" stroke="url(#roseBar)" stroke-width="14" stroke-dasharray="400" class="bar-fill" stroke-linecap="round"/>
    <text x="725" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">D2C, E-Commerce, Growth Tech</text>
  </g>

  <!-- Factor 6: Achievement Evidence (10%) -->
  <g transform="translate(35, 230)">
    <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Achievement Evidence</text>
    <text x="210" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">10%</text>
    <rect x="260" y="4" width="450" height="14" rx="7" fill="#1e293b" />
    <line x1="260" y1="11" x2="305" y2="11" stroke="url(#amberBar)" stroke-width="14" stroke-dasharray="400" class="bar-fill" stroke-linecap="round"/>
    <text x="725" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Metrics (CAC, ROAS, Scaled Budgets)</text>
  </g>

  <!-- Factor 7: Location / Work Mode (5%) -->
  <g transform="translate(35, 263)">
    <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Location / Work Mode</text>
    <text x="210" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">5%</text>
    <rect x="260" y="4" width="450" height="14" rx="7" fill="#1e293b" />
    <line x1="260" y1="11" x2="282.5" y2="11" stroke="url(#blueBar)" stroke-width="14" stroke-dasharray="400" class="bar-fill" stroke-linecap="round"/>
    <text x="725" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Bengaluru, Remote, Hybrid</text>
  </g>
</svg>
