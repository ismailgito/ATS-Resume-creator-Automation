<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="nodeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dashed flow lines */
    .flow-line {
      stroke-dasharray: 6 6;
      animation: flowStream 1.5s linear infinite;
    }

    /* Moving energy data packets along the pipeline */
    .data-packet {
      animation: movePacket 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: center;
    }

    /* Sequential Node Highlighting */
    .node-1 { animation: stagePulse 6s ease-in-out 0s infinite; }
    .node-2 { animation: stagePulse 6s ease-in-out 1s infinite; }
    .node-3 { animation: stagePulse 6s ease-in-out 2s infinite; }
    .node-4 { animation: stagePulse 6s ease-in-out 3s infinite; }
    .node-5 { animation: stagePulse 6s ease-in-out 4s infinite; }
    .node-6 { animation: stagePulse 6s ease-in-out 5s infinite; }

    /* Active Beacon Rings */
    .active-beacon {
      animation: beaconFlash 2s ease-in-out infinite alternate;
    }

    @keyframes flowStream {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes stagePulse {
      0%, 100% {
        transform: translateY(0px);
        filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2));
      }
      20% {
        transform: translateY(-4px);
        filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.9));
      }
      40% {
        transform: translateY(0px);
        filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2));
      }
    }

    @keyframes movePacket {
      0% { transform: translate(160px, 140px); opacity: 0; }
      5% { opacity: 1; }
      15% { transform: translate(200px, 140px); opacity: 1; }
      20% { transform: translate(315px, 140px); opacity: 0; }
      25% { transform: translate(315px, 140px); opacity: 1; }
      35% { transform: translate(355px, 140px); opacity: 1; }
      40% { transform: translate(470px, 140px); opacity: 0; }
      45% { transform: translate(470px, 140px); opacity: 1; }
      55% { transform: translate(510px, 140px); opacity: 1; }
      60% { transform: translate(625px, 140px); opacity: 0; }
      65% { transform: translate(625px, 140px); opacity: 1; }
      75% { transform: translate(665px, 140px); opacity: 1; }
      80% { transform: translate(780px, 140px); opacity: 0; }
      85% { transform: translate(780px, 140px); opacity: 1; }
      95% { transform: translate(820px, 140px); opacity: 1; }
      100% { transform: translate(860px, 140px); opacity: 0; }
    }

    @keyframes beaconFlash {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 6px #10b981); }
    }
  </style>

  <!-- Frame Background -->
  <rect x="5" y="5" width="940" height="270" rx="14" fill="url(#wfBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Pipeline Header -->
  <text x="35" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">⚡ AUTONOMOUS PIPELINE WITH HUMAN-IN-THE-LOOP APPROVAL QUEUE</text>
  <text x="730" y="38" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">LIVE AUTOMATION FLOW</text>
  <line x1="35" y1="48" x2="915" y2="48" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Connecting Flow Lines -->
  <line x1="160" y1="140" x2="200" y2="140" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
  <line x1="315" y1="140" x2="355" y2="140" stroke="#818cf8" stroke-width="2.5" class="flow-line" />
  <line x1="470" y1="140" x2="510" y2="140" stroke="#c084fc" stroke-width="2.5" class="flow-line" />
  <line x1="625" y1="140" x2="665" y2="140" stroke="#34d399" stroke-width="2.5" class="flow-line" />
  <line x1="780" y1="140" x2="820" y2="140" stroke="#fbbf24" stroke-width="2.5" class="flow-line" />

  <!-- Animated Data Packet Orb traveling between stages -->
  <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#nodeGlow)" class="data-packet" />

  <!-- STAGE 1: Job Ingestion -->
  <g transform="translate(35, 80)" class="node-1">
    <rect x="0" y="0" width="125" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="125" height="24" rx="10" fill="#0284c7" fill-opacity="0.25"/>
    <text x="12" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">01. INGESTION</text>
    <text x="14" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Job Sources</text>
    <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Manual Paste</text>
    <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Naukri URL</text>
    <text x="14" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; JSON / CSV</text>
  </g>

  <!-- STAGE 2: Parser -->
  <g transform="translate(200, 80)" class="node-2">
    <rect x="0" y="0" width="115" height="120" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="24" rx="10" fill="#4f46e5" fill-opacity="0.25"/>
    <text x="12" y="16" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">02. PARSER</text>
    <text x="14" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Normalize</text>
    <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Clean HTML</text>
    <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Synonyms</text>
    <text x="14" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Exp Range</text>
  </g>

  <!-- STAGE 3: Match Scorer -->
  <g transform="translate(355, 80)" class="node-3">
    <rect x="0" y="0" width="115" height="120" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="24" rx="10" fill="#9333ea" fill-opacity="0.25"/>
    <text x="12" y="16" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">03. SCORING</text>
    <text x="14" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Fit Index</text>
    <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; 7 Weighted KPIs</text>
    <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Gap Audit</text>
    <text x="14" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Neg Rules</text>
  </g>

  <!-- STAGE 4: Resume Tailor -->
  <g transform="translate(510, 80)" class="node-4">
    <rect x="0" y="0" width="115" height="120" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="24" rx="10" fill="#059669" fill-opacity="0.25"/>
    <text x="12" y="16" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">04. TAILOR</text>
    <text x="14" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Multi-Doc</text>
    <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; ATS Markdown</text>
    <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Word .DOCX</text>
    <text x="14" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Searchable PDF</text>
  </g>

  <!-- STAGE 5: Validation Gate -->
  <g transform="translate(665, 80)" class="node-5">
    <rect x="0" y="0" width="115" height="120" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="24" rx="10" fill="#e11d48" fill-opacity="0.25"/>
    <text x="12" y="16" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">05. QUALITY</text>
    <text x="14" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Fact Audit</text>
    <text x="14" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Fact Registry</text>
    <text x="14" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Stuffing Check</text>
    <text x="14" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; ATS Structure</text>
  </g>

  <!-- STAGE 6: Review & Apply -->
  <g transform="translate(820, 80)" class="node-6">
    <rect x="0" y="0" width="95" height="120" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="95" height="24" rx="10" fill="#d97706" fill-opacity="0.25"/>
    <text x="8" y="16" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700">06. APPROVAL</text>
    <text x="10" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Review</text>
    <text x="10" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; CLI Queue</text>
    <text x="10" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; Apply Naukri</text>
    <text x="10" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">&bull; SQLite Log</text>
  </g>

  <!-- Footer Stats Line -->
  <g transform="translate(35, 232)">
    <circle cx="10" cy="10" r="4" fill="#10b981" class="active-beacon"/>
    <text x="24" y="14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Automated Pipeline: Discovery &bull; Parsing &bull; Scoring &bull; Tailoring &bull; Fact Audit</text>
    
    <circle cx="560" cy="10" r="4" fill="#fbbf24" class="active-beacon"/>
    <text x="574" y="14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Human-in-the-Loop Gate: Review Queue &bull; Final Submission on Naukri</text>
  </g>
</svg>
