<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="33%" stop-color="#818cf8" />
      <stop offset="66%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #34d399; #38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e; #fb923c; #c084fc; #f43f5e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#fb923c">
        <animate attributeName="stop-color" values="#fb923c; #38bdf8; #f43f5e; #fb923c" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmer Overlay Gradient -->
    <linearGradient id="shimmerGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Laser Border Animation */
    .laser-border {
      stroke-dasharray: 120 400;
      animation: laserRun 6s linear infinite;
    }
    
    /* Beacon Pulse Animation */
    .beacon-ring {
      animation: ringPulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: center;
    }
    
    .pulse-dot {
      animation: dotPulse 2s ease-in-out infinite;
    }

    /* Grid Tech Lines Fade */
    .grid-line {
      animation: gridPulse 4s ease-in-out infinite alternate;
    }

    /* Card Floating Animations */
    .badge-float-1 { animation: float 3.5s ease-in-out 0.0s infinite alternate; }
    .badge-float-2 { animation: float 3.5s ease-in-out 0.4s infinite alternate; }
    .badge-float-3 { animation: float 3.5s ease-in-out 0.8s infinite alternate; }
    .badge-float-4 { animation: float 3.5s ease-in-out 1.2s infinite alternate; }
    .badge-float-5 { animation: float 3.5s ease-in-out 1.6s infinite alternate; }

    /* Particles Floating */
    .particle-1 { animation: particleMove1 12s linear infinite; }
    .particle-2 { animation: particleMove2 16s linear infinite; }
    .particle-3 { animation: particleMove3 10s linear infinite; }

    @keyframes laserRun {
      0% { stroke-dashoffset: 1040; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }

    @keyframes ringPulse {
      0% { r: 4px; opacity: 1; stroke-width: 2px; }
      100% { r: 14px; opacity: 0; stroke-width: 0.5px; }
    }

    @keyframes gridPulse {
      0% { opacity: 0.15; }
      100% { opacity: 0.45; }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    @keyframes particleMove1 {
      0% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(40px, -20px); opacity: 0.8; }
      100% { transform: translate(0, 0); opacity: 0.2; }
    }

    @keyframes particleMove2 {
      0% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(-30px, 15px); opacity: 0.9; }
      100% { transform: translate(0, 0); opacity: 0.3; }
    }

    @keyframes particleMove3 {
      0% { transform: translate(0, 0); opacity: 0.1; }
      50% { transform: translate(50px, 10px); opacity: 0.7; }
      100% { transform: translate(0, 0); opacity: 0.1; }
    }
  </style>

  <!-- Card Background -->
  <rect x="10" y="10" width="980" height="300" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Laser Border Overlay -->
  <rect x="10" y="10" width="980" height="300" rx="16" fill="none" stroke="url(#accentBorder)" stroke-width="2.5" class="laser-border" />

  <!-- Background Ambient Floating Particles -->
  <circle cx="150" cy="80" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="480" cy="50" r="2.5" fill="#818cf8" class="particle-2" />
  <circle cx="850" cy="110" r="3.5" fill="#c084fc" class="particle-3" />
  <circle cx="320" cy="180" r="2" fill="#34d399" class="particle-1" />
  <circle cx="680" cy="200" r="3" fill="#f43f5e" class="particle-2" />

  <!-- Grid Tech Lines -->
  <g class="grid-line">
    <path d="M 50 40 L 950 40 M 50 280 L 950 280 M 300 10 L 300 310 M 700 10 L 700 310" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Top Laser Accent Bar -->
  <line x1="10" y1="10" x2="990" y2="10" stroke="url(#accentBorder)" stroke-width="3.5" />

  <!-- Status Pill Left (Green Active Engine) -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Animated Beacon Rings -->
    <circle cx="16" cy="15" r="4" fill="none" stroke="#10b981" class="beacon-ring" />
    <circle cx="16" cy="15" r="5" fill="#10b981" class="pulse-dot" />
    <text x="32" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ATS AUTOMATION ENGINE v1.0</text>
  </g>

  <!-- Tag Pill Right (Purple Human-In-The-Loop) -->
  <g transform="translate(710, 45)">
    <rect x="0" y="0" width="240" height="30" rx="15" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="16" cy="15" r="4" fill="none" stroke="#a855f7" class="beacon-ring" />
    <circle cx="16" cy="15" r="5" fill="#a855f7" class="pulse-dot" />
    <text x="32" y="19" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">HUMAN-IN-THE-LOOP VERIFIED</text>
  </g>

  <!-- Main Title with Shimmering Gradient -->
  <text x="50" y="125" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
    ATS Resume Automation Engine
  </text>

  <!-- Subtitle Lines -->
  <text x="50" y="165" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    Factual ATS-Tailored Resumes (Markdown, DOCX, PDF) &amp; Deterministic Scoring for Marketing
  </text>

  <text x="50" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Targeting Performance Marketing &bull; Digital Marketing &bull; Growth &bull; Paid Search &amp; Social
  </text>

  <!-- Animated Feature Cards Row -->
  <g transform="translate(50, 220)">
    <!-- Pill 1: Factuality Gate -->
    <g class="badge-float-1">
      <rect x="0" y="0" width="165" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">100% FACTUAL</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Zero Hallucinations</text>
    </g>

    <!-- Pill 2: Multi-Format -->
    <g transform="translate(180, 0)" class="badge-float-2">
      <rect x="0" y="0" width="165" height="52" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="24" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">MULTI-FORMAT</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">PDF &bull; DOCX &bull; MD</text>
    </g>

    <!-- Pill 3: Fit Matrix -->
    <g transform="translate(360, 0)" class="badge-float-3">
      <rect x="0" y="0" width="175" height="52" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">DETERMINISTIC</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Transparent 7-Factor Fit</text>
    </g>

    <!-- Pill 4: Offline Ready -->
    <g transform="translate(550, 0)" class="badge-float-4">
      <rect x="0" y="0" width="170" height="52" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="24" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">OFFLINE READY</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Works without API keys</text>
    </g>

    <!-- Pill 5: Tracker -->
    <g transform="translate(735, 0)" class="badge-float-5">
      <rect x="0" y="0" width="165" height="52" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">SQLITE TRACKER</text>
      <text x="16" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Audit Trail &amp; Analytics</text>
    </g>
  </g>
</svg>
