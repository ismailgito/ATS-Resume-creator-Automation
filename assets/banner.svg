<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" shape-rendering="crispEdges" role="img">
<style>
text{font-family:'Courier New', Courier, monospace;font-weight:700}

.tw{animation:tw 2.4s steps(6) infinite;transform-box:fill-box;transform-origin:left}
@keyframes tw{0%{transform:scaleX(0)}50%,100%{transform:scaleX(1)}}
.pop{animation:pop 3s steps(1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,45%{transform:scale(0)}50%{transform:scale(1.3)}58%,92%{transform:scale(1)}100%{transform:scale(0)}}
.st{animation:st 2s steps(1) infinite}
@keyframes st{0%{opacity:1}50%{opacity:.1}100%{opacity:1}}
.bob{animation:bob 1.6s steps(1) infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.cur{animation:st 1s steps(1) infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
