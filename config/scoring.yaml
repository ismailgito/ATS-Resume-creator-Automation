# ATS Resume Automation - Deterministic Match Scoring Configuration
# ─────────────────────────────────────────────────────────────────
# HOW TO USE THIS FOR A DIFFERENT PROFESSION
# ─────────────────────────────────────────────────────────────────
# 1. Set `domain.candidate_domain` to your profession label (free text, used in mismatch messages).
# 2. Update `domain.candidate_title_tokens` — single-word title tokens that identify YOUR domain.
#    These protect your roles from being classified as "out-of-domain".
# 3. Update `domain.out_of_domain_tokens` — single-word title tokens that mark ALIEN domains.
#    Roles whose titles contain only these (and none of your candidate_title_tokens) get hard-rejected.
# 4. Update `domain.out_of_domain_skills` — specific technical skills that belong to alien domains.
#    Missing many of these triggers the domain-mismatch penalty.
# 5. Update `domain.achievement_keywords` — words used to score how relevant your achievements
#    are to a given JD. Use terms from YOUR discipline, not generic ones.
# 6. Update `domain.industry_keywords` — industry/sector words that indicate a good context for you.
# ─────────────────────────────────────────────────────────────────
weights:
  title_role_fit: 0.20
  required_skills: 0.25
  platform_tools: 0.15
  experience_fit: 0.15
  industry_fit: 0.10
  location_fit: 0.05
  achievement_relevance: 0.10

thresholds:
  auto_generate_resume: 80.0
  medium_fit_review: 65.0
  research_queue: 50.0
  rejection_cutoff: 50.0

